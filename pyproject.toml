[build-system]
requires = ["uv_build >= 0.13.6, <0.14.0"]
build-backend = "uv_build"

[project]
name = "edge-perf-lab"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "numpy",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.ruff]
target-version = "py310"

[tool.uv.build-backend]
module-name = "bench"
module-root = ""